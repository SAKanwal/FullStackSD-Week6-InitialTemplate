name: Windows Build (MAUI)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Restore
        run: dotnet restore Week6-RESTFULAPI.csproj -p:TargetFrameworks=net9.0-windows10.0.19041.0

      - name: Publish Windows EXE
        run: |
          dotnet publish Week6-RESTFULAPI.csproj `
          -f net9.0-windows10.0.19041.0 `
          -c Release `
          -p:RuntimeIdentifierOverride=win10-x64 `
          -p:WindowsPackageType=None `
          -p:WindowsAppSDKSelfContained=true `
          --no-restore

      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: bin/Release/net9.0-windows10.0.19041.0/win10-x64/publish/